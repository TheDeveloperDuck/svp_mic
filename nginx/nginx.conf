worker_processes 1;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_connect_timeout 60s;

        location /api/customers {
            set $upstream http://customer_user_service:8000;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $upstream;
        }

        location /api/users {
            set $upstream http://customer_user_service:8000;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $upstream;
        }

        location /api/plans {
            set $upstream http://planning_service:8000;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $upstream;
        }

        location /api/expenses {
            set $upstream http://expense_service:8000;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $upstream;
        }

        location / {
            set $upstream http://frontend_service:8000;
            proxy_pass $upstream;
        }
    }
}
