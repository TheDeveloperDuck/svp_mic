worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_connect_timeout 60s;

        location /api/customers {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://customer_user_service:8000;
        }

        location /api/users {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://customer_user_service:8000;
        }

        location /api/plans {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://planning_service:8000;
        }

        location /api/expenses {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://expense_service:8000;
        }

        location / {
            proxy_pass http://frontend_service:8000;
        }
    }
}
