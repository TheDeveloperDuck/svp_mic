services:

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy Gateway
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      customer_user_service:
        condition: service_started
      planning_service:
        condition: service_started
      expense_service:
        condition: service_started
      frontend_service:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend Service
  # ---------------------------------------------------------------------------
  frontend_service:
    build:
      context: .
      dockerfile: frontend_service/Dockerfile
    container_name: frontend_service
    ports:
      - "8080:8000"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Expense Service
  # ---------------------------------------------------------------------------
  expense_service:
    build:
      context: .
      dockerfile: expense_service/Dockerfile
    container_name: expense_service
    depends_on:
      expense_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Expense Service — PostgreSQL
  # ---------------------------------------------------------------------------
  expense_db:
    image: postgres:16
    container_name: expense_db
    environment:
      POSTGRES_DB: ${EXPENSE_DB_NAME}
      POSTGRES_USER: ${EXPENSE_DB_USER}
      POSTGRES_PASSWORD: ${EXPENSE_DB_PASSWORD}
    volumes:
      - expense_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EXPENSE_DB_USER} -d ${EXPENSE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Planning Service
  # ---------------------------------------------------------------------------
  planning_service:
    build:
      context: .
      dockerfile: planning_service/Dockerfile
    container_name: planning_service
    env_file:
      - .env
    depends_on:
      planning_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Planning Service — PostgreSQL
  # ---------------------------------------------------------------------------
  planning_db:
    image: postgres:16
    container_name: planning_db
    environment:
      POSTGRES_DB: ${PLANNING_DB_NAME}
      POSTGRES_USER: ${PLANNING_DB_USER}
      POSTGRES_PASSWORD: ${PLANNING_DB_PASSWORD}
    volumes:
      - planning_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLANNING_DB_USER} -d ${PLANNING_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Customer & User Service
  # ---------------------------------------------------------------------------
  customer_user_service:
    build:
      context: .
      dockerfile: customer_user_service/Dockerfile
    env_file:
      - .env
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      customer_user_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Customer & User Service — PostgreSQL
  # ---------------------------------------------------------------------------
  customer_user_db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${CUSTOMER_USER_DB_NAME}
      POSTGRES_USER: ${CUSTOMER_USER_DB_USER}
      POSTGRES_PASSWORD: ${CUSTOMER_USER_DB_PASSWORD}
    volumes:
      - customer_user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CUSTOMER_USER_DB_USER} -d ${CUSTOMER_USER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Zookeeper
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/commands/ruok | grep -q ruok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  expense_db_data:
  planning_db_data:
  customer_user_db_data:
