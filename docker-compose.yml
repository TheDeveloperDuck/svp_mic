services:

  # ---------------------------------------------------------------------------
  # Customer & User Service
  # ---------------------------------------------------------------------------
  customer_user_service:
    build:
      context: .
      dockerfile: customer_user_service/Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      customer_user_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Customer & User Service — PostgreSQL
  # ---------------------------------------------------------------------------
  customer_user_db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${CUSTOMER_USER_DB_NAME}
      POSTGRES_USER: ${CUSTOMER_USER_DB_USER}
      POSTGRES_PASSWORD: ${CUSTOMER_USER_DB_PASSWORD}
    volumes:
      - customer_user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CUSTOMER_USER_DB_USER} -d ${CUSTOMER_USER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Zookeeper
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/commands/ruok | grep -q ruok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  customer_user_db_data:
