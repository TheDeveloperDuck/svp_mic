# =============================================================================
# Alembic configuration for the Planning Service.
#
# The database URL below is a placeholder only.  The real value is read from
# the .env file inside alembic/env.py and overrides this setting at runtime.
# =============================================================================

[alembic]
script_location = planning_service/alembic

# Placeholder — overridden in env.py from PLANNING_DATABASE_URL.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Prepend the current date to auto-generated migration file names.
# Format: YYYY-MM-DD_<rev>_<slug>.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Maximum line length for auto-generated migration files.
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
