# Ingress to customer-user-db: only from customer-user-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-customer-user-db-ingress
  namespace: svp
spec:
  podSelector:
    matchLabels:
      app: customer-user-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: customer-user-service
      ports:
        - protocol: TCP
          port: 5432
---
# Ingress to customer-user-service: from frontend-service and istio ingress gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-customer-user-service-ingress
  namespace: svp
spec:
  podSelector:
    matchLabels:
      app: customer-user-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend-service
      ports:
        - protocol: TCP
          port: 8001
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
---
# Egress from customer-user-service to its dependencies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-customer-user-service-egress
  namespace: svp
spec:
  podSelector:
    matchLabels:
      app: customer-user-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: customer-user-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
