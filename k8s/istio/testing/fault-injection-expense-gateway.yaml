# TESTING ONLY: overwrites production VirtualService by name. Restore with: kubectl apply -f k8s/istio/virtual-services.yaml
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: expense-service-vs
  namespace: svp
spec:
  hosts:
    - "*"
  gateways:
    - svp-gateway
  http:
    - match:
        - uri:
            prefix: /api/expenses
      fault:
        abort:
          percentage:
            value: 30
          httpStatus: 503
      rewrite:
        uri: /expenses
      route:
        - destination:
            host: expense-service
            port:
              number: 8003
