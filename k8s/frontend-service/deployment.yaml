apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: svp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
        - name: frontend-service
          image: svp/frontend-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CUSTOMER_USER_SERVICE_URL
              value: "http://customer-user-service.svp.svc.cluster.local:8001"
            - name: PLANNING_SERVICE_URL
              value: "http://planning-service.svp.svc.cluster.local:8002"
            - name: EXPENSE_SERVICE_URL
              value: "http://expense-service.svp.svc.cluster.local:8003"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: svp-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
