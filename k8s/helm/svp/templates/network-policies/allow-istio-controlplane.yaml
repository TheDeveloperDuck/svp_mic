# Egress from all pods to istio-system for xDS, mTLS bootstrap, and telemetry
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istiod-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012  # istiod: xDS mTLS (Envoy bootstrap)
        - protocol: TCP
          port: 15010  # istiod: xDS plaintext (debug only)
        - protocol: TCP
          port: 15014  # istiod: control-plane monitoring / telemetry
        - protocol: TCP
          port: 9411   # Zipkin collector: sidecar trace reporting
---
# Ingress from istio-system for sidecar health checks
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-healthcheck-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15020  # Envoy merged Prometheus telemetry
        - protocol: TCP
          port: 15021  # Envoy health check
