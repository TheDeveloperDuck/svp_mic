apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
      annotations:
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379,9092,2181"
    spec:
      containers:
        - name: frontend-service
          image: "{{ .Values.image.repository }}/{{ .Values.images.frontendService }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: CUSTOMER_USER_SERVICE_URL
              value: "http://customer-user-service.{{ .Release.Namespace }}.svc.cluster.local:8001"
            - name: PLANNING_SERVICE_URL
              value: "http://planning-service.{{ .Release.Namespace }}.svc.cluster.local:8002"
            - name: EXPENSE_SERVICE_URL
              value: "http://expense-service.{{ .Release.Namespace }}.svc.cluster.local:8003"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
